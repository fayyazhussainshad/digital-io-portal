# Digital IO — ہر تبدیلی پر خودکار جانچ (v547)
# ہر PR: lint + unit tests + اصل ایپ کی جانچ (Desktop/Mobile/پرنٹ)۔ main پر push: lint + unit tests۔
# کوئی بھی جانچ ناکام ہو تو PR پر سرخ نشان — غلط کوڈ live جانے سے پہلے رک جائے۔
# v562: ریپو private ہے (27 اکتوبر کا اتفاق) — GitHub کے مفت منٹ محدود؛ اصل ایپ کی لمبی جانچ (~50 منٹ)
#   PR پر چلتی ہے (وہی merge والا کوڈ جانچتی ہے)، main پر دوبارہ نہیں۔ ضرورت ہو تو Actions سے ہاتھ سے بھی۔
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  real-app:
    name: Real app (desktop + mobile + print)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04   # v558: «latest» کی نئی تصویر پر تنصیب ناکام — جانچ والی تصویر پکی
    timeout-minutes: 120    # v564: اصل چھپائی کی جانچ کے بعد 60 منٹ سے اوپر؛ v570: ٹیبوں کی جانچ (t22_*) بھی
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright, Pillow, poppler, LibreOffice (v554 — Word .docx کھول کر جانچ)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Test fonts (Jameel Noori = the app's real font, Noto = fallback) and DOMPurify
        working-directory: tests/real-app
        run: |
          mkdir -p .deps/fontpkg .deps/jameel .deps/purify .deps/fabric .deps/pdfjs
          (cd .deps/fontpkg && npm pack @fontsource/noto-nastaliq-urdu --silent && tar xzf *.tgz)
          (cd .deps/jameel && npm pack jameel-noori@1.1.2 --silent && tar xzf *.tgz)
          (cd .deps/purify && npm pack dompurify@3.1.6 --silent && tar xzf *.tgz)
          (cd .deps/fabric && npm pack fabric@5.3.0 --silent && tar xzf *.tgz)
          (cd .deps/pdfjs && npm pack pdfjs-dist@3.11.174 --silent && tar xzf *.tgz)
      - name: Serve the app
        run: |
          python -m http.server 8770 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8770/index.html > /dev/null && break; sleep 1; done
      - name: Incident report (real_test.py)
        working-directory: tests/real-app
        run: bash ci_run.sh real_test.py
      - name: Core flows (core_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh core_test.py
      - name: Case-file index (index_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh index_test.py
      - name: FIR text page (fir_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh fir_test.py
      - name: Landing Quran/Hadith + dashboard order (landing_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh landing_test.py
      - name: System forms, PDF/Word share, auto interim challan (v551_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v551_test.py
      - name: Zimni save/sync/print, landing, login, case form, CDR, challan, right-click (v552_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v552_test.py
      - name: v553 list — no approval, case print/share, two-part accused/witness, naqsha list/straight lines, paper at print, back-side binding mark, Word keys, 14pt, mobile FIR PDF, PDF/Word share, toolbar guide (v553_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v553_test.py
      - name: v554 — cross version only when added, case print card / list, print·download·share separate, whole case = each document's own print (print / PDF / Word page by page), centred headings (v554_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v554_test.py
      - name: v555 — RFA one page, saza/zimni column lines to page bottom, zimni binding mark only on pages 2/4/6 (A4 + Legal), IO line spacing and alignment, narrow col 4, zimni number and one-per-date warnings, English rank stays RTL (v555_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v555_test.py
      - name: v558 — statements 161 (androoni zimni) save local-first + server + autosave draft + sync, witness dropdown, (زیردفعہ 161ض ف) at left border, IO name/date SOP, Ctrl+S/Ctrl+P/top-bar never the challan route, zimni column lines to page bottom in editor; Urdu-keyboard Ctrl+S/Ctrl+P, closing line, wider col 4, no lone serial 1, unified list buttons, auto-sync while online, text beside binding line (v558_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v558_test.py
      - name: v557 — 5-C entry without subject, case-linked 5-C applications chip and list (v557_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v557_test.py
      - name: v560 — cross-device sync, two devices at once (desktop + mobile, one server) — new/edit/delete/restore within 10 s without refresh, offline → online no duplicate, autosave draft across devices, two-version conflict choice, statements 161, challan, cases, top-bar status, no-session, write-block keeps reading, lost reply → retry without duplicate or false conflict (v560_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v560_sync_test.py
      - name: v560 — read-only device inventory + backup tool (v560_inventory_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v560_inventory_test.py
      - name: v561/v562 — expiry = view only (no print / write / edit, search open, renew unlocks; suspended = full lock), all officer settings on both devices (SHO / DSP, signature, vehicle, own lists, suggestions, papers; never theme / secrets; first-sync merge; shared device safe), case sharing removed, patrol (gasht) removed (v561_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v561_test.py
      - name: v563 — MS Word shortcuts everywhere (one global handler, Urdu layout too) — Ctrl+S saves (never the browser's Save-As), X/C/V, drag-move, Ctrl+F main search, Ctrl+H find/replace, B/I/U, own undo/redo ≥ 20 steps, J/R/L/E per paragraph, Ctrl+[ / ] 1pt, Ctrl+A this document only, Ctrl+P = print button; Tab = 1.27 cm (first-line indent at paragraph start, exact in justify), Shift+Tab / Backspace back, table cell Tab = next cell; formatting through save → reload → print → PDF → Word; shortcuts list (desktop only) (v563_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v563_test.py
      - name: v564 — bairooni zimni print & layout — Ctrl+P = print button = browser-menu print (pixel-identical, Legal + A4, nothing cut), 2pt binding line with text beside it and a new serial inside its zone (no empty block), closing line «۔» + half space, «از» 12% → 24%, bound date + SHO name, IO name fixed (read-only, no binding), date centred under signature, nothing lost in print (v569 — font kerning off on the challan only — zimni back to its pre-3-Nov spacing), one zimni per date, manual column 2 (v564_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v564_test.py
      - name: v560 — self-hosted Jameel Noori only (no fallback, offline via service worker, embedded in print), every font size in pt, save → reload (v560_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v560_test.py
      - name: v566 — bairooni zimni Task 6 — number as written (2-الف) in list / index / print / search, column-1 date only, one zimni per officer per date + senior officer (SHO / DSP) zimni 3-الف / 3-ب with fixed name, accused ▾ never auto-inserted (select / deselect live, reopen unchanged), 161 serial (fixed, printed), cross-version column 3 with separate ▾ (v566_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v566_test.py
      - name: v566 — two devices + reload (number, date, senior officer, accused, 161) (v566_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v566_sync_test.py
      - name: v567 — index (انڈیکس نقل مسل) — «بنام» FIR and cross-version accused separate, cross-version complainant + accused under «کراس ورژن», zimni table never split across pages, non-cross case unchanged (v567_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v567_test.py
      - name: v568 — Task 7 — zimni list (row print = inside print = Ctrl+P, no PDF / نقل, number 2-الف + column-1 date, buttons = case list), print-all = each zimni's own print (old Sep layout + attached androoni sheet too), duplicate zimni (mark, same date/officer/number refused, fixed → saved, mark gone, not in index / 161), statement 161 save (button + Ctrl+S, witness name + written date, server «duplicate» never shown as saved, next free serial after a deleted statement, autosave), standalone 161 = 27 Oct look (paper kerning auto; v579: statement text kerning off), attached androoni sheet separated, Ctrl+S / top-bar save on a zimni with attached sheet = zimni (v568_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v568_test.py
      - name: v568 — two devices + reload (statement 161 button / Ctrl+S, duplicate zimni) (v568_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v568_sync_test.py
      - name: v569 — word spacing — the 3 Nov «font kerning off» rule only on the challan (report 173) — challan screen / print button / Ctrl+P (byte-identical) / browser-menu print / share PDF kerning off, narrowest gap ≥ 0.19em; bairooni zimni, darkhwast, saza slip, index, RFA, incident report back to the pre-3-Nov spacing (kerning auto); statement 161 paper auto, its statement text off (v579, justified); whole-case print — challan part off, others auto (v569_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v569_test.py
      - name: v569 — two devices + reload (challan kerning off, zimni auto) (v569_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v569_sync_test.py
      - name: Task 22 — tabs, per-tab back/forward, pages stay open, exit question, reload restore (t22_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t22_test.py
      - name: Task 22 — print inside a tab (button = Ctrl+P = browser menu = before tabs) (t22_print_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t22_print_test.py
      - name: Task 22 — two devices + reload inside tabs (t22_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t22_sync_test.py
      - name: Task 22 — view-only, PIN lock, logout, officer separation inside tabs (t22_misc_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t22_misc_test.py
      - name: Task 22 — new tab without internet under the service worker (t22_offline_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t22_offline_test.py
      - name: Task 9 — one serial-number rule everywhere (1 name → no «1», 2+ → 1۔ 2۔, live), report 173 column alignment (screen = print = mobile), long «مختصر حالات» text, no joined words after reopen/print (t9_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t9_test.py
      - name: Task 9 — two devices + reload (serials, no joined words, same columns) (t9_sync_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t9_sync_test.py
      - name: v575 — whole system without the top document bar (⋯ menu in the bottom corner), zimni ▾ in the paper corners (right = type, left = nature), no «لکھنے والا» field (SHO / DSP from the type), heading «رپورٹ ضمنی بیرونی» protected, khulasa in column 4 instead of «از», کوائف in the case chip «وقوعہ جات», naqsha distinctive marks after the four directions, DSP line name-rank-post-circle, Ctrl+R / L / E, plus v574 (151 MW templates, 0.6 cm bottom margin, binding line, Ctrl+S / Ctrl+P, reload, one zimni per date) (v575_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v575_test.py
      - name: TASK 19 — one button and one icon set everywhere (each action = one look across 15 screens, case-list standard 24pt / 33pt, same print/share/download/copy/duplicate/back icon, no emoji / own SVG, ▾ pickers one look, buttons still do their job, ⋯ print = Ctrl+P, tab bar icons from the set) (t19_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh t19_test.py
      - name: v577 — statements 161 without the top bar (witness ▾ in the paper's right corner, complainant first, save / print / back from ⋯), «اپ ڈیٹ» after save (zimni + statement + ⋯ row), admin panel messages in Urdu (v577_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v577_test.py
      - name: v578 — documents always open full-page with «⋯» even when a case is opened right after the app starts (doc-viewer.js awaited by openCaseWorkspace; a failed module load can be retried) (v578_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v578_test.py
      - name: v579 — Task 7-C11 — statement 161 text fully justified (Urdu RTL, last line right) on screen, print, share PDF and Word, no joined words (every gap ≥ 0.19em), the line before a page break justified too; headings / signature unchanged; attached androoni sheet of a bairooni zimni unchanged (v579_test.py)
        if: always()
        working-directory: tests/real-app
        run: bash ci_run.sh v579_test.py
      - name: Screenshots and print PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-app-out
          path: tests/real-app/out/
          retention-days: 14
