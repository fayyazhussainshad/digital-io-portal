# Digital IO — ہر تبدیلی پر خودکار جانچ (v547)
# ہر PR اور main پر ہر push: lint + unit tests + اصل ایپ کی جانچ (Desktop/Mobile/پرنٹ)۔
# کوئی بھی جانچ ناکام ہو تو PR پر سرخ نشان — غلط کوڈ live جانے سے پہلے رک جائے۔
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  real-app:
    name: Real app (desktop + mobile + print)
    runs-on: ubuntu-24.04   # v558: «latest» کی نئی تصویر پر تنصیب ناکام — جانچ والی تصویر پکی
    timeout-minutes: 60
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright, Pillow, poppler, LibreOffice (v554 — Word .docx کھول کر جانچ)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Test fonts (Jameel Noori = the app's real font, Noto = fallback) and DOMPurify
        working-directory: tests/real-app
        run: |
          mkdir -p .deps/fontpkg .deps/jameel .deps/purify .deps/fabric .deps/pdfjs
          (cd .deps/fontpkg && npm pack @fontsource/noto-nastaliq-urdu --silent && tar xzf *.tgz)
          (cd .deps/jameel && npm pack jameel-noori@1.1.2 --silent && tar xzf *.tgz)
          (cd .deps/purify && npm pack dompurify@3.1.6 --silent && tar xzf *.tgz)
          (cd .deps/fabric && npm pack fabric@5.3.0 --silent && tar xzf *.tgz)
          (cd .deps/pdfjs && npm pack pdfjs-dist@3.11.174 --silent && tar xzf *.tgz)
      - name: Serve the app
        run: |
          python -m http.server 8770 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8770/index.html > /dev/null && break; sleep 1; done
      - name: Incident report (real_test.py)
        working-directory: tests/real-app
        run: python real_test.py
      - name: Core flows (core_test.py)
        if: always()
        working-directory: tests/real-app
        run: python core_test.py
      - name: Patrol log (gasht_test.py)
        if: always()
        working-directory: tests/real-app
        run: python gasht_test.py
      - name: Case-file index (index_test.py)
        if: always()
        working-directory: tests/real-app
        run: python index_test.py
      - name: FIR text page (fir_test.py)
        if: always()
        working-directory: tests/real-app
        run: python fir_test.py
      - name: Landing Quran/Hadith + dashboard order (landing_test.py)
        if: always()
        working-directory: tests/real-app
        run: python landing_test.py
      - name: System forms, PDF/Word share, auto interim challan (v551_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v551_test.py
      - name: Zimni save/sync/print, landing, login, case form, CDR, challan, right-click (v552_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v552_test.py
      - name: v553 list — no approval, case print/share, two-part accused/witness, naqsha list/straight lines, paper at print, back-side binding mark, Word keys, 14pt, mobile FIR PDF, PDF/Word share, toolbar guide (v553_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v553_test.py
      - name: v554 — cross version only when added, case print card / list, print·download·share separate, whole case = each document's own print (print / PDF / Word page by page), centred headings (v554_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v554_test.py
      - name: v555 — RFA one page, saza/zimni column lines to page bottom, zimni binding mark only on pages 2/4/6 (A4 + Legal), IO line spacing and alignment, narrow col 4, zimni number and one-per-date warnings, English rank stays RTL (v555_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v555_test.py
      - name: v558 — statements 161 (androoni zimni) save local-first + server + autosave draft + sync, witness dropdown, (زیردفعہ 161ض ف) at left border, IO name/date SOP, Ctrl+S/Ctrl+P/top-bar never the challan route, zimni column lines to page bottom in editor; Urdu-keyboard Ctrl+S/Ctrl+P, closing line, wider col 4, no lone serial 1, unified list buttons, auto-sync while online, text beside binding line (v558_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v558_test.py
      - name: v557 — 5-C entry without subject, case-linked 5-C applications chip and list (v557_test.py)
        if: always()
        working-directory: tests/real-app
        run: python v557_test.py
      - name: Screenshots and print PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-app-out
          path: tests/real-app/out/
          retention-days: 14
