<!doctype html>
<!-- TASK 22 — ڈیزائن کا نمونہ (MOCKUP) — کام کرنے والا کوڈ نہیں۔
     صرف تصویریں بنانے کے لیے: اوپر ٹیبوں کی پٹی، نیچے اصل Digital IO (index.html) فریم میں۔ -->
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital IO — ٹیبز (ڈیزائن)</title>
<style>
@font-face { font-family:'Jameel Noori Nastaleeq'; src:url('/fonts/jameel-noori-nastaleeq.woff2') format('woff2'); }
:root { --strip:#0b1730; --tab:#14284a; --tabtxt:#c9d4e6; --gold:#d4a72c; --accent:#38bdf8; --card:#ffffff; --ink:#0f1d36; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#eef2f7; font-family:'Jameel Noori Nastaleeq', serif; }
bdi { unicode-bidi:isolate; direction:ltr; font-family:Arial, sans-serif; }
#shell { display:flex; flex-direction:column; height:100vh; }
/* ── ٹیبوں کی پٹی (Desktop) ── */
#strip { height:40px; flex-shrink:0; background:var(--strip); display:flex; align-items:flex-end; gap:4px; padding:0 8px; direction:rtl; }
#strip .nav { display:flex; gap:2px; align-self:center; }
#strip.left .nav { order:99; margin-right:auto; }
.nb { width:34px; height:30px; border:none; border-radius:8px; background:transparent; color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.nb svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.nb:hover { background:rgba(255,255,255,.10); }
.nb.off { opacity:.35; }
.nb.back { width:auto; padding:0 10px 0 8px; gap:6px; font-size:10.5pt; }
.tabs { display:flex; gap:2px; align-items:flex-end; min-width:0; flex:1 1 auto; overflow:hidden; }
.tab { height:34px; min-width:120px; max-width:210px; flex:0 1 210px; display:flex; align-items:center; gap:6px; padding:0 12px 0 6px; border-radius:10px 10px 0 0; color:var(--tabtxt); font-size:10.5pt; white-space:nowrap; position:relative; cursor:pointer; }
.tab .t { overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; padding-top:2px; }
.tab .n { flex-shrink:0; font-size:9.75pt; opacity:.9; }
.tab .x { margin-right:0; }
.tab .ic { width:15px; height:15px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; opacity:.85; }
.tab .x { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font:9pt Arial, sans-serif; color:inherit; opacity:.75; flex-shrink:0; }
.tab .x:hover { background:rgba(255,255,255,.18); opacity:1; }
.tab .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0; }
.tab:not(.on):hover { background:rgba(255,255,255,.06); }
.tab:not(.on) + .tab:not(.on)::before { content:''; position:absolute; right:-2px; top:9px; bottom:9px; width:1px; background:rgba(255,255,255,.16); }
.tab.on { background:var(--tab); color:#fff; box-shadow:inset 0 2px 0 var(--gold); }
.tab.split2 { background:rgba(255,255,255,.10); color:#fff; box-shadow:inset 0 2px 0 var(--accent); }
.plus { align-self:center; flex-shrink:0; margin:0 4px 2px 0; width:30px; height:30px; border-radius:8px; border:none; background:transparent; color:#fff; font:16pt Arial, sans-serif; line-height:1; cursor:pointer; }
.plus:hover { background:rgba(255,255,255,.10); }
.endtools { margin-right:auto; display:flex; gap:6px; align-self:center; }
#strip.left .endtools { margin-right:0; }
.split-btn { height:28px; border:1px solid rgba(255,255,255,.28); border-radius:8px; background:transparent; color:#fff; font-size:9.75pt; padding:0 10px; display:inline-flex; align-items:center; gap:6px; }
.split-btn.on { background:var(--accent); border-color:var(--accent); color:#06223a; }
.split-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; }
/* ── مواد ── */
#content { flex:1; min-height:0; display:flex; direction:rtl; background:#cfd8e4; gap:0; }
#content iframe { border:none; flex:1; min-width:0; height:100%; background:#fff; }
#content .pane { flex:1; min-width:0; display:flex; flex-direction:column; }
#content .pane .ph { height:24px; flex-shrink:0; background:#dfe7f1; color:#334155; font-size:9pt; display:flex; align-items:center; gap:6px; padding:0 10px; border-bottom:1px solid #c3cfdd; }
#content .pane.focus .ph { background:#e0f2fe; color:#075985; box-shadow:inset 0 -2px 0 var(--accent); }
#content .div { width:6px; background:#94a3b8; cursor:col-resize; flex-shrink:0; }
/* ── موبائل پٹی ── */
body.m #strip { height:48px; align-items:center; gap:4px; padding:0 6px; }
body.m .nb { width:38px; height:38px; }
body.m .mtitle { flex:1; min-width:0; color:#fff; font-size:11.25pt; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-top:3px; }
body.m .count { width:30px; height:30px; border:2px solid #fff; border-radius:8px; color:#fff; font:700 11pt Arial, sans-serif; display:inline-flex; align-items:center; justify-content:center; background:transparent; }
body.m .plus { width:38px; height:38px; }
/* ── موبائل: ٹیبوں کی فہرست ── */
#sheet { position:fixed; inset:0; background:#eef2f7; z-index:50; display:none; flex-direction:column; direction:rtl; }
#sheet.on { display:flex; }
#sheet .hd { height:56px; background:var(--strip); color:#fff; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:13pt; }
#sheet .hd .sp { flex:1; }
#sheet .hd button { height:36px; border-radius:9px; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; font:10.5pt 'Jameel Noori Nastaleeq'; padding:0 12px; }
#sheet .hd button.pri { background:var(--gold); border-color:var(--gold); color:#1b1300; font-weight:700; }
#sheet .list { padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
#sheet .card { background:#fff; border:1px solid #d6dee9; border-radius:14px; padding:10px 14px 12px 10px; display:flex; gap:10px; align-items:flex-start; }
#sheet .card.on { border:2px solid #0369a1; box-shadow:0 2px 10px rgba(3,105,161,.15); }
#sheet .card .bd { flex:1; min-width:0; }
#sheet .card .tt { font-size:12pt; color:var(--ink); font-weight:700; }
#sheet .card .pth { font-size:9.75pt; color:#64748b; margin-top:2px; }
#sheet .card .uns { display:inline-block; margin-top:6px; font-size:9pt; color:#92400e; background:#fef3c7; border:1px solid #fcd34d; border-radius:20px; padding:1px 10px; }
#sheet .card .cx { width:34px; height:34px; border-radius:50%; border:1px solid #d6dee9; background:#f8fafc; font:12pt Arial; color:#475569; flex-shrink:0; }
#sheet .ft { margin-top:auto; padding:10px 12px 16px; color:#64748b; font-size:9.75pt; text-align:center; }
/* ── بند کرنے کی تصدیق ── */
#exit { position:fixed; inset:0; background:rgba(5,12,24,.55); z-index:60; display:none; align-items:center; justify-content:center; direction:rtl; }
#exit.on { display:flex; }
#exit .box { width:min(440px, 92vw); background:#fff; border-radius:16px; padding:20px 22px 18px; box-shadow:0 18px 50px rgba(0,0,0,.35); }
#exit h3 { margin:0 0 6px; font-size:16pt; color:var(--ink); }
#exit p { margin:0 0 16px; font-size:11.25pt; color:#475569; line-height:1.9; }
#exit .row { display:flex; gap:10px; }
#exit .row button { flex:1; height:44px; border-radius:10px; font:11.25pt 'Jameel Noori Nastaleeq'; cursor:pointer; }
#exit .stay { background:#0f3a63; color:#fff; border:none; font-weight:700; }
#exit .go { background:#fff; color:#b91c1c; border:1px solid #fecaca; }
/* نمونہ کا نشان */
#mk { position:fixed; left:8px; bottom:8px; z-index:70; background:rgba(15,29,54,.85); color:#fde68a; font-size:9pt; padding:3px 10px; border-radius:20px; }
</style>
</head>
<body>
<div id="shell">
  <div id="strip"></div>
  <div id="content"></div>
</div>
<div id="sheet"></div>
<div id="exit"><div class="box">
  <h3>کیا آپ بند کرنا چاہتے ہیں؟</h3>
  <p>آپ کا تمام کام خودکار محفوظ ہو چکا ہے۔ کھلی ٹیبیں اگلی بار لاگ اِن کے بعد واپس آ جائیں گی۔</p>
  <div class="row"><button class="stay">نہیں — Digital IO میں رہیں</button><button class="go">ہاں، بند کریں</button></div>
</div></div>
<div id="mk">ڈیزائن کا نمونہ</div>
<script>
const I = {
  back: '<svg viewBox="0 0 24 24"><path d="M14 6l6 6-6 6"/><path d="M20 12H4"/></svg>',
  fwd:  '<svg viewBox="0 0 24 24"><path d="M10 6l-6 6 6 6"/><path d="M4 12h16"/></svg>',
  home: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M9.5 20v-6h5v6"/></svg>',
  doc:  '<svg class="ic" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg>',
  fold: '<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2.5h9V19a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19z"/></svg>',
  split:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>',
};
// عنوان: اردو حصہ + مقدمہ نمبر <bdi> میں
function T(t) { return t.replace(/(\d+\/\d+)/g, '<bdi>$1</bdi>'); }
window.mockSetup = function (cfg) {
  document.body.className = cfg.mobile ? 'm' : '';
  const strip = document.getElementById('strip');
  strip.className = cfg.navSide === 'left' ? 'left' : '';
  const tabs = cfg.tabs;
  const act = tabs.find(t => t.on) || tabs[0];
  if (!cfg.mobile) {
    strip.innerHTML =
      (cfg.navSide === 'left'
        ? '<div class="nav" style="direction:ltr"><button class="nb back" title="واپس (Alt+←)">' + I.fwd + '<span>واپس</span></button>' +
          '<button class="nb fwd' + (cfg.fwdOff ? ' off' : '') + '" title="آگے (Alt+→)">' + I.back + '</button></div>'
        : '<div class="nav"><button class="nb back" title="واپس (Alt+←)">' + I.back + '<span>واپس</span></button>' +
          '<button class="nb fwd' + (cfg.fwdOff ? ' off' : '') + '" title="آگے (Alt+→)">' + I.fwd + '</button></div>') +
      '<div class="tabs">' + tabs.map(t =>
        '<div class="tab' + (t.on ? ' on' : '') + (t.split2 ? ' split2' : '') + '" title="' + t.t.replace(/"/g, '') + '">' +
        (I[t.ic] || I.doc) + '<span class="t">' + t.t + '</span>' + (t.n ? '<bdi class="n">' + t.n + '</bdi>' : '<span class="n"></span>') + (t.dirty ? '<span class="dot" title="غیر محفوظ تبدیلی (خودکار محفوظ)"></span>' : '') +
        '<span class="x" title="ٹیب بند کریں">✕</span></div>').join('') + '<button class="plus" title="نئی ٹیب (Alt+T)">+</button></div>' +
      '<div class="endtools"><button class="split-btn' + (cfg.split ? ' on' : '') + '">' + I.split + '<span>ساتھ ساتھ</span></button></div>';
  } else {
    strip.innerHTML =
      '<button class="nb" title="واپس">' + I.back + '</button>' +
      '<button class="nb' + (cfg.fwdOff ? ' off' : '') + '" title="آگے">' + I.fwd + '</button>' +
      '<div class="mtitle">' + act.t + (act.n ? ' · <bdi>' + act.n + '</bdi>' : '') + '</div>' +
      '<button class="count" title="کھلی ٹیبیں">' + tabs.length + '</button>' +
      '<button class="plus" title="نئی ٹیب">+</button>';
  }
  const c = document.getElementById('content');
  if (cfg.split) {
    c.innerHTML =
      '<div class="pane focus"><div class="ph">' + T(cfg.split[0]) + '</div><iframe id="f1" src="/index.html?dtab=1"></iframe></div>' +
      '<div class="div"></div>' +
      '<div class="pane"><div class="ph">' + T(cfg.split[1]) + '</div><iframe id="f2" src="/index.html?dtab=2"></iframe></div>';
  } else {
    c.innerHTML = '<iframe id="f1" src="/index.html?dtab=1"></iframe>';
  }
  const sh = document.getElementById('sheet');
  if (cfg.sheet) {
    sh.innerHTML = '<div class="hd"><span>کھلی ٹیبیں (<bdi>' + tabs.length + '</bdi>)</span><span class="sp"></span>' +
      '<button class="pri">+ نئی ٹیب</button><button>واپس</button></div><div class="list">' +
      tabs.map(t => '<div class="card' + (t.on ? ' on' : '') + '"><div class="bd"><div class="tt">' + T(t.t) + '</div>' +
        '<div class="pth">' + T(t.path || '') + '</div>' + (t.dirty ? '<span class="uns">غیر محفوظ تبدیلی — خودکار محفوظ</span>' : '') +
        '</div><button class="cx" title="بند کریں">✕</button></div>').join('') +
      '</div><div class="ft">ٹیب پر ٹیپ کریں تو وہی کھلے گی — بند صرف ✕ سے</div>';
    sh.classList.add('on');
  } else sh.classList.remove('on');
  document.getElementById('exit').classList.toggle('on', !!cfg.exit);
  return 0;
};
</script>
</body>
</html>
